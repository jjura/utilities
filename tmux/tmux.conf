#-------------------------------------------------------------------------------
# Set: Terminal
#-------------------------------------------------------------------------------
set -g default-terminal "$TERM"
set -ga terminal-overrides ",$TERM:Tc"

#-------------------------------------------------------------------------------
# Set: Escape time
#-------------------------------------------------------------------------------
set -g escape-time 0

#-------------------------------------------------------------------------------
# Set: Prefix
#-------------------------------------------------------------------------------
set -g prefix C-a

#-------------------------------------------------------------------------------
# Set: Mouse
#-------------------------------------------------------------------------------
set -g mouse on

#-------------------------------------------------------------------------------
# Set: Status
#-------------------------------------------------------------------------------
set -g status-left ''
set -g status-right ''
set -g status-style bg=default,fg=default

#-------------------------------------------------------------------------------
# Set: Window status
#-------------------------------------------------------------------------------
set -g window-status-format '#[bg=color4,fg=color0] #I #[bg=default,fg=color8] #W'
set -g window-status-current-format '#[bg=color1,fg=color0] #I #[bg=default,fg=color7] #W'

#-------------------------------------------------------------------------------
# Set: Pane
#-------------------------------------------------------------------------------
set -g pane-border-style bg=default,fg=color8
set -g pane-active-border-style bg=default,fg=color8

#-------------------------------------------------------------------------------
# Set: Message
#-------------------------------------------------------------------------------
set -g message-style bg=default,fg=default

#-------------------------------------------------------------------------------
# Unbind: Copy mode
#-------------------------------------------------------------------------------
unbind -T copy-mode -a
unbind -T copy-mode-vi -a

#-------------------------------------------------------------------------------
# Unbind: Prefix
#-------------------------------------------------------------------------------
unbind -T prefix -a

#-------------------------------------------------------------------------------
# Unbind: Root
#-------------------------------------------------------------------------------
unbind -T root -a

#-------------------------------------------------------------------------------
# Bind: Window
#-------------------------------------------------------------------------------
bind 'c' new-window
bind 'n' next-window
bind 'p' previous-window

#-------------------------------------------------------------------------------
# Bind: Kill pane
#-------------------------------------------------------------------------------
bind 'x' confirm-before -p 'Kill the pane #P? (y/n)' kill-pane

#-------------------------------------------------------------------------------
# Bind: Select pane
#-------------------------------------------------------------------------------
bind 'h' select-pane -L
bind 'j' select-pane -D
bind 'k' select-pane -U
bind 'l' select-pane -R

#-------------------------------------------------------------------------------
# Bind: Split window
#-------------------------------------------------------------------------------
bind '-' split-window -v
bind '|' split-window -h

#-------------------------------------------------------------------------------
# Bind: Command prompt
#-------------------------------------------------------------------------------
bind ':' command-prompt

#-------------------------------------------------------------------------------
# Bind: Layout
#-------------------------------------------------------------------------------
bind '=' select-layout even-horizontal
bind '+' select-layout even-vertical

#-------------------------------------------------------------------------------
# Bind: Resize
#-------------------------------------------------------------------------------
bind 'z' resize-pane -Z

#-------------------------------------------------------------------------------
# Bind: Scroll
#-------------------------------------------------------------------------------
bind -T copy-mode Escape send-keys -X cancel
bind -T copy-mode WheelDownPane select-pane \; send-keys -X -N 5 scroll-down
bind -T copy-mode WheelUpPane select-pane \; send-keys -X -N 5 scroll-up

#-------------------------------------------------------------------------------
# Bind: Selection
#-------------------------------------------------------------------------------
bind -T copy-mode MouseDrag1Pane select-pane \; send-keys -X begin-selection
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

#-------------------------------------------------------------------------------
# Bind: Mouse
#-------------------------------------------------------------------------------
bind -T root MouseDown1Pane select-pane -t = \; send-keys -M
bind -T root MouseDrag1Border resize-pane -M
bind -T root WheelUpPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -e }
